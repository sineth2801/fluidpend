<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>FluidPend Sensor Test</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 90%;
        }

        button {
            font-size: 14px;
            padding: 9px 14px;
            border: 1px solid #444;
            border-radius: 8px;
            margin: 4px;
            background: #222;
            color: white;
        }

        #status {
            
           margin-top: 6px;
           font-size: 12px;
           color: #888;
        }

        #values {
          position: fixed;
          bottom: 25px;
          left: 50%;
          transform:translateX(-50%);
          font-family: monospace;
          font-size: 12px;
          color: #777;
          text-align: center;             
           
        }
    </style>
</head>

<body>

<div id="controls">
    <button id="motionButton">
        Enable Motion
    </button>

    <button id="resetButton">
        Reset Particles
    </button>

    <div id="status">
        Motion sensor not enabled
    </div>
</div>

<canvas id="canvas"></canvas>

<div id="values">
    Gravity X: 0<br>
    Gravity Y: 0
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const motionButton =
    document.getElementById("motionButton");

const resetButton =
    document.getElementById("resetButton");

const statusText =
    document.getElementById("status");

const valuesText =
    document.getElementById("values");


/* ---------------------------------
   Canvas size
---------------------------------- */

function resizeCanvas() {

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ---------------------------------
   Gravity
---------------------------------- */

let gravityX = 0;
let gravityY = 180;


/* ---------------------------------
   Particle settings
---------------------------------- */

const particles = [];

const particleCount = 260;

const particleRadius = 3.5;

function getLayout() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    // Outer handheld FluidPend body
    const bodyWidth =
        Math.min(width * 0.82, 390);

    const bodyHeight =
        Math.min(height * 0.68, 590);

    const bodyX =
        (width - bodyWidth) / 2;

    const bodyY =
        Math.max(
            70,
            (height - bodyHeight) / 2
        );

    // Circular display
    const containerRadius =
        bodyWidth * 0.36;

    const cx =
        width / 2;

    const cy =
        bodyY +
        bodyHeight * 0.34;

    return {

        width,
        height,

        bodyWidth,
        bodyHeight,

        bodyX,
        bodyY,

        cx,
        cy,

        containerRadius
    };
}

function createParticles() {

    particles.length = 0;

    const layout =
        getLayout();

    const cx =
        layout.cx;

    const cy =
        layout.cy;

    const r =
        layout.containerRadius;

    let attempts = 0;

    while (
        particles.length <
        particleCount &&
        attempts <
        particleCount * 20
    ) {

        attempts++;

        const x =
            cx +
            (Math.random() - 0.5) *
            r * 1.45;

        const y =
            cy +
            r * 0.12 +
            Math.random() *
            r * 0.63;

        const dx =
            x - cx;

        const dy =
            y - cy;

        if (
            dx * dx +
            dy * dy <
            (r - 8) *
            (r - 8)
        ) {

            particles.push({

                x: x,
                y: y,

                vx: 0,
                vy: 0

            });
        }
    }
}

createParticles();


/* ---------------------------------
   iPhone orientation handling
---------------------------------- */

function handleOrientation(event) {

    /*
       beta:
       front/back tilt

       gamma:
       left/right tilt
    */

    let beta =
        event.beta || 0;

    let gamma =
        event.gamma || 0;


    /*
       Limit angles so extreme
       rotations do not cause
       ridiculous acceleration.
    */

    beta =
        Math.max(
            -90,
            Math.min(90, beta)
        );

    gamma =
        Math.max(
            -90,
            Math.min(90, gamma)
        );


    const betaRad =
        beta *
        Math.PI /
        180;

    const gammaRad =
        gamma *
        Math.PI /
        180;


    const gravityStrength =
        450;


    /*
       Convert phone orientation
       into 2D gravity.
    */

    gravityX =
        Math.sin(gammaRad) *
        gravityStrength;

    gravityY =
        Math.sin(betaRad) *
        gravityStrength;


    valuesText.innerHTML =
        "Beta: " +
        beta.toFixed(1) +
        "°<br>" +

        "Gamma: " +
        gamma.toFixed(1) +
        "°<br>" +

        "Gravity X: " +
        gravityX.toFixed(1) +
        "<br>" +

        "Gravity Y: " +
        gravityY.toFixed(1);
}


/* ---------------------------------
   Ask iPhone for permission
---------------------------------- */

async function enableMotion() {

    try {

        if (
            typeof DeviceOrientationEvent !==
            "undefined" &&
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ) {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (
                permission ===
                "granted"
            ) {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation
                );

                statusText.innerText =
                    "Motion enabled";

                motionButton.style.display =
                    "none";

            }

            else {

                statusText.innerText =
                    "Motion permission denied";
            }

        }

        else {

            /*
              Android and some other
              browsers may not require
              the explicit permission API.
            */

            window.addEventListener(
                "deviceorientation",
                handleOrientation
            );

            statusText.innerText =
                "Motion enabled";

            motionButton.style.display =
                "none";
        }

    }

    catch (error) {

        console.error(error);

        statusText.innerText =
            "Motion sensor error";
    }
}


motionButton.addEventListener(
    "click",
    enableMotion
);


resetButton.addEventListener(
    "click",
    createParticles
);


/* ---------------------------------
   Desktop keyboard controls
---------------------------------- */

window.addEventListener(
    "keydown",
    function(event) {

        const g = 220;

        if (
            event.key ===
            "ArrowLeft"
        ) {

            gravityX = -g;
            gravityY = 0;
        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            gravityX = g;
            gravityY = 0;
        }

        if (
            event.key ===
            "ArrowUp"
        ) {

            gravityX = 0;
            gravityY = -g;
        }

        if (
            event.key ===
            "ArrowDown"
        ) {

            gravityX = 0;
            gravityY = g;
        }
    }
);


/* ---------------------------------
   Particle physics
---------------------------------- */

function updateParticles(dt) {

const layout =
    getLayout();

const width =
    layout.width;

const height =
    layout.height;

const cx =
    layout.cx;

const cy =
    layout.cy;

const containerRadius =
    layout.containerRadius;



    for (
        const p of particles
    ) {

        /*
           Gravity changes velocity
        */

        p.vx +=
            gravityX * dt;

        p.vy +=
            gravityY * dt;


        /*
           Small damping
        */

        p.vx *= 0.997;
        p.vy *= 0.997;


        /*
           Velocity changes position
        */

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;


        /*
           Circular wall collision
        */

        const dx =
            p.x - cx;

        const dy =
            p.y - cy;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const maximumDistance =
            containerRadius -
            particleRadius;


        if (
            distance >
            maximumDistance
        ) {

            const nx =
                dx / distance;

            const ny =
                dy / distance;


            p.x =
                cx +
                nx *
                maximumDistance;

            p.y =
                cy +
                ny *
                maximumDistance;


            const velocityNormal =
                p.vx * nx +
                p.vy * ny;


            if (
                velocityNormal > 0
            ) {

                p.vx -=
                    1.5 *
                    velocityNormal *
                    nx;

                p.vy -=
                    1.5 *
                    velocityNormal *
                    ny;
            }
        }
    }


    /*
       Very simple particle
       separation.
    */

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const a =
                particles[i];

            const b =
                particles[j];


            let dx =
                b.x - a.x;

            let dy =
                b.y - a.y;


            let distanceSquared =
                dx * dx +
                dy * dy;


            const minimumDistance =
                particleRadius * 2;


            if (
                distanceSquared <
                minimumDistance *
                minimumDistance &&
                distanceSquared >
                0.0001
            ) {

                const distance =
                    Math.sqrt(
                        distanceSquared
                    );

                const nx =
                    dx / distance;

                const ny =
                    dy / distance;


                const overlap =
                    minimumDistance -
                    distance;


                a.x -=
                    nx *
                    overlap *
                    0.5;

                a.y -=
                    ny *
                    overlap *
                    0.5;


                b.x +=
                    nx *
                    overlap *
                    0.5;

                b.y +=
                    ny *
                    overlap *
                    0.5;
            }
        }
    }
}


/* ---------------------------------
   Drawing
---------------------------------- */

function draw() {

    const layout =
        getLayout();

    const width =
        layout.width;

    const height =
        layout.height;

    const cx =
        layout.cx;

    const cy =
        layout.cy;

    const r =
        layout.containerRadius;


    /*
       Clear background
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle =
        "#101010";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Draw handheld enclosure
    */

    ctx.beginPath();

    ctx.roundRect(
        layout.bodyX,
        layout.bodyY,
        layout.bodyWidth,
        layout.bodyHeight,
        layout.bodyWidth * 0.17
    );

    ctx.fillStyle =
        "#252525";

    ctx.fill();

    ctx.strokeStyle =
        "#333333";

    ctx.lineWidth =
        3;

    ctx.stroke();


    /*
       Circular black display
    */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        r,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#020707";

    ctx.fill();

    ctx.strokeStyle =
        "#111818";

    ctx.lineWidth =
        7;

    ctx.stroke();


    /*
       Create virtual LED/pixel display
    */

    const pixelSize =
        Math.max(
            5,
            Math.floor(
                (r * 2) / 46
            )
        );

    const left =
        cx - r;

    const top =
        cy - r;

    const columns =
        Math.ceil(
            (r * 2) /
            pixelSize
        );

    const rows =
        columns;


    /*
       Fluid density map
    */

    const density =
        new Float32Array(
            columns * rows
        );


    function addDensity(
        column,
        row,
        amount
    ) {

        if (
            column < 0 ||
            row < 0 ||
            column >= columns ||
            row >= rows
        ) {
            return;
        }

        density[
            row * columns +
            column
        ] += amount;
    }


    /*
       Convert particle positions
       into display pixels
    */

    for (
        const p of particles
    ) {

        const column =
            Math.floor(
                (p.x - left) /
                pixelSize
            );

        const row =
            Math.floor(
                (p.y - top) /
                pixelSize
            );


        addDensity(
            column,
            row,
            1
        );

        addDensity(
            column + 1,
            row,
            0.35
        );

        addDensity(
            column - 1,
            row,
            0.35
        );

        addDensity(
            column,
            row + 1,
            0.35
        );

        addDensity(
            column,
            row - 1,
            0.35
        );
    }


    /*
       Draw virtual LEDs
    */

    const gap =
        0.7;

    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let column = 0;
            column < columns;
            column++
        ) {

            const value =
                density[
                    row * columns +
                    column
                ];


            if (
                value < 0.3
            ) {
                continue;
            }


            const x =
                left +
                column *
                pixelSize;

            const y =
                top +
                row *
                pixelSize;


            /*
               Make sure LED is
               inside circular screen
            */

            const px =
                x +
                pixelSize / 2;

            const py =
                y +
                pixelSize / 2;

            const dx =
                px - cx;

            const dy =
                py - cy;


            if (
                dx * dx +
                dy * dy >
                (r - 5) *
                (r - 5)
            ) {
                continue;
            }


            /*
               Cyan FluidPend pixels
            */

            ctx.fillStyle =
                "#32DDE3";

            ctx.fillRect(
                x + gap,
                y + gap,

                pixelSize -
                gap * 2,

                pixelSize -
                gap * 2
            );
        }
    }
}


/* ---------------------------------
   Main simulation loop
---------------------------------- */

let previousTime =
    performance.now();


function animate(time) {

    let dt =
        (time - previousTime) /
        1000;

    previousTime =
        time;


    /*
       Prevent huge time steps
       if browser freezes briefly.
    */

    dt =
        Math.min(
            dt,
            0.04
        );


    updateParticles(dt);

    draw();


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>

</html>
